<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loss experience</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 56rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    label { margin-right: 1.5rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
    th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    tr.total td { font-weight: bold; border-top: 2px solid #222; }
    tr.losing td:nth-child(5) { color: #b00020; font-weight: bold; }
    #message { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>Loss experience</h1>
  <p>Pick a portfolio to see premium, loss and loss ratio for each peril. All money is in DKK.</p>

  <label>Portfolio <select id="portfolio"></select></label>
  <label>Underwriting year
    <select id="year">
      <option value="">All years</option>
      <option>2022</option>
      <option>2023</option>
      <option>2024</option>
    </select>
  </label>

  <p id="message"></p>
  <table id="result" hidden>
    <thead>
      <tr>
        <th>Peril</th><th>Policies</th><th>Premium</th><th>Loss</th>
        <th>Loss ratio</th><th>Claims</th><th>Largest claim</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const portfolioSelect = document.getElementById("portfolio");
    const yearSelect = document.getElementById("year");
    const message = document.getElementById("message");
    const table = document.getElementById("result");
    const body = table.querySelector("tbody");

    function money(value) {
      return value.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function percent(ratio) {
      if (ratio === null) {
        return "-";
      }
      return (ratio * 100).toFixed(1) + "%";
    }

    function addRow(name, row, className) {
      const tr = document.createElement("tr");
      if (className) {
        tr.classList.add(className);
      }
      // A loss ratio above 100% means the claims cost more than the premium.
      if (row.loss_ratio !== null && row.loss_ratio > 1) {
        tr.classList.add("losing");
      }
      const cells = [
        name,
        row.policy_count,
        money(row.earned_premium),
        money(row.incurred_loss),
        percent(row.loss_ratio),
        row.claim_count,
        money(row.largest_claim),
      ];
      for (const text of cells) {
        const td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }

    async function show() {
      const params = new URLSearchParams();
      if (yearSelect.value) {
        params.set("underwriting_year", yearSelect.value);
      }
      const url = "/portfolios/" + portfolioSelect.value + "/loss-experience?" + params;
      const response = await fetch(url);
      if (!response.ok) {
        table.hidden = true;
        message.textContent = "Could not load the numbers.";
        return;
      }
      const data = await response.json();
      body.innerHTML = "";
      for (const peril of data.perils) {
        addRow(peril.peril, peril);
      }
      addRow("Total", data.total, "total");
      message.textContent = "";
      table.hidden = false;
    }

    async function start() {
      const response = await fetch("/portfolios/loss-experience");
      const data = await response.json();
      for (const portfolio of data.portfolios) {
        const option = document.createElement("option");
        option.value = portfolio.portfolio_id;
        option.textContent = portfolio.portfolio_id + " (loss ratio " + percent(portfolio.loss_ratio) + ")";
        portfolioSelect.appendChild(option);
      }
      portfolioSelect.addEventListener("change", show);
      yearSelect.addEventListener("change", show);
      show();
    }

    start();
  </script>
</body>
</html>
